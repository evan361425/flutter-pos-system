name: possystem
description: POS system by Flutter
publish_to: "none"
homepage: https://github.com/evan361425/flutter-pos-system
version: 2.12.1+21201002

environment:
  flutter: ">=3.47.0 <3.48.0"
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # core helper
  go_router: ^18.1.2
  provider: ^6.1.5
  intl: ^0.20.3
  collection: ^1.19.1
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  firebase_crashlytics: ^5.4.0
  firebase_in_app_messaging: ^0.9.4
  firebase_performance: ^0.11.6

  # services
  sqflite: ^2.4.5  # 26, 10
  sembast: ^3.9.0  # 26, 10
  shared_preferences: ^2.5.6
  http: ^1.6.0  # deps of flutter
  packages:
    git:
      url: https://github.com/evan361425/flutter-pos-packages
      ref: 2026.11.08-01

  # google services
  googleapis: ^14.0.0
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

  # components
  table_calendar: ^3.3.0  # 26, 10
  syncfusion_flutter_charts: ^35.1.41
  spotlight_ant: ^1.4.5
  editor_ant: ^1.3.11

  # image
  image: ^4.12.0
  image_picker: ^1.2.4
  file_picker: ^13.3.0  # 26, 10
  image_cropper: ^13.0.0
  cached_network_image: ^4.0.6  # 26, 10
  flutter_svg: ^2.3.2

  # Make it easy to test
  file: ^7.0.1  # 24, 10-08

  # tools
  uuid: ^4.6.0  # 26, 07
  wakelock_plus: ^1.8.0  # 26, 10
  characters: ^1.4.1  # deps of flutter
  path_provider: ^2.1.6  # deps of flutter
  url_launcher: ^6.3.2  # deps of flutter
  flutter_native_splash: ^2.4.8  # 26, 05
  package_info_plus: ^10.2.2  # 26, 10
  visibility_detector: ^0.4.0+2  # 23, 03-09
  excel:
    git:
      url: https://github.com/evan361425/excel
      ref: patch-1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # widget test
  golden_test: ^2.2.0

  # code style
  flutter_lints: ^6.0.0

  # mock object
  build_runner: ^2.16.2
  mockito: ^5.8.1
  sqflite_common: ^2.5.14  # logging
  sqflite_common_ffi: ^2.4.5

  arb_glue: ^1.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
  - assets/food_placeholder.png
  - assets/google_sheet_icon.svg
  - assets/feature_request_please.gif
  - assets/google_signin_button.svg
  - assets/excel_icon.svg

# flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#5c98ff"
  fullscreen: true
  image: assets/logo.png

arb_glue:
  source: assets/l10n
  destination: lib/l10n
  author: Lu Shueh Chou
  fileTemplate: 'app_{lang}.arb'
  base: en
  lastModified: false
  verbose: true
