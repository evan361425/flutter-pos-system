name: Flutter Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          channel: stable
          cache: true

      - name: Install dependencies
        env:
          GH_READ_PAT: ${{ secrets.GH_READ_PAT }}
        run: |
          if [ -n "$GH_READ_PAT" ]; then
            echo "https://oauth:${GH_READ_PAT}@github.com" > ~/.git-credentials
            git config --global credential.helper store
          fi
          flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # google-services.json is gitignored; inject from repo secrets (never commit the file).
      - name: Configure Google Services
        working-directory: android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is required for Android release builds"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > google-services.json

      # key.properties / keystore are never committed — reconstruct from secrets for signed release.
      - name: Configure Android signing
        working-directory: android
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          if [ -z "$PLAY_STORE_UPLOAD_KEY" ]; then
            echo "::error::PLAY_STORE_UPLOAD_KEY secret is required for Android release builds"
            exit 1
          fi
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > key.properties

      # Product flavors (prod/dev) are required by android/app/build.gradle
      - name: Build APK
        run: flutter build apk --release --flavor prod

      - name: Build App Bundle
        run: flutter build appbundle --release --flavor prod

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/prodRelease/*.aab
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        env:
          GH_READ_PAT: ${{ secrets.GH_READ_PAT }}
        shell: bash
        run: |
          if [ -n "$GH_READ_PAT" ]; then
            echo "https://oauth:${GH_READ_PAT}@github.com" > ~/.git-credentials
            git config --global credential.helper store
          fi
          flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows release
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) {
            throw "Windows build output not found at $src"
          }
          Compress-Archive -Path "$src\*" -DestinationPath "posflu-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: posflu-windows.zip
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs:
      - build-android
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts/android

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows

      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find artifacts/android -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} release-assets/ \;
          cp artifacts/windows/posflu-windows.zip release-assets/
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/posflu-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
